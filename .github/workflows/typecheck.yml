name: typecheck

on:
  push:
    paths:
      - "ui/**"
      - "types/**"
      - "jsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typecheck.yml"
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
