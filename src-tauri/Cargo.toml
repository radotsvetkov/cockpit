[package]
name = "soma-cockpit"
version = "0.1.0"
edition = "2021"
description = "soma cockpit - the transparency control room for the soma agent runtime"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
